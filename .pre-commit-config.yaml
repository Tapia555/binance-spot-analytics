repos:
  - repo: https://github.com/psf/black
    rev: 24.8.0
    hooks:
      - id: black
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.0
    hooks:
      - id: ruff
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.11.0
    hooks:
      - id: mypy
        files: src/
        args: [--config-file, pyproject.toml]
        additional_dependencies:
          - aiohttp>=3.10
          - websockets>=13.0
          - PyYAML>=6.0
          - python-dotenv>=1.0
          - numpy>=2.0
          - pandas>=2.2
