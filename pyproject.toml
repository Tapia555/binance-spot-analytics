[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crypto-bot"
version = "0.1.0"
description = "Crypto Trading Bot"
requires-python = ">=3.11"
dependencies = [
    "python-binance==1.0.19",
    "python-dotenv==1.0.0",
    "pyyaml==6.0.1",
    "requests==2.31.0",
    "aiohttp==3.9.1",
    "pandas==2.1.4",
    "numpy==1.26.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pre-commit>=3.0",
]
